<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo App</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="container_sub">
            <div class="heading">
                <h1>Welcome <span class="greeting_name">ToDo</span> User</h1>
            </div>

            <div class="toDoAdd">
                <form id="toDoAdd_form">
                    <input type="text" name="taskName" id="taskInput" placeholder="Enter task..." required>
                    <button type="submit" class="addTaskBtn" id="add_btn">Add</button>
                </form>
            </div>



            <div class="taskContainer" id="taskList">
                <!-- using javascript adding the requried items-->
            </div>

        </div>
    </div>
</body>

<script src="./app.js"></script>
</html>
